# ===============================
# APPLICATION
# ===============================

spring.application.name=AI-LEARNING-PLATFORM
server.port=8080


# ===============================
# MySQL DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_learning
spring.datasource.username=root
spring.datasource.password=koushik@9
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# OLLAMA
# ===============================

ollama.api.url=http://localhost:11434/api/generate
ollama.model=llama3:latest


# ===============================
# LOGIN SECURITY
# ===============================

# Maximum wrong login attempts
login.max-attempts=5

# Account lock duration in minutes
login.lock-duration-minutes=15


# ===============================
# JWT CONFIGURATION
# ===============================

# JWT expiration time: 30 minutes
jwt.expiration=1800000


# ===============================
# EMAIL CONFIGURATION
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Your Gmail address
spring.mail.username=YOUR_GMAIL@gmail.com

# Gmail App Password
# Do NOT use your normal Gmail password
spring.mail.password=YOUR_16_CHARACTER_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optional timeout settings
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000